spring.datasource.auth.jdbc-url = ${SPRING_DATASOURCE_AUTH_URL}
spring.datasource.auth.username = ${SPRING_DATASOURCE_AUTH_USERNAME}
spring.datasource.auth.password = ${SPRING_DATASOURCE_AUTH_PASSWORD}
spring.datasource.auth.hikari.jdbcUrl = ${SPRING_DATASOURCE_AUTH_URL}
spring.datasource.auth.hikari.maximum-pool-size=10
spring.datasource.auth.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

jwt.secret=5466478365873465897368456739865367567834567
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

server.port=8081

user.service.url=${USER_SERVICE_URL:http://user-service:8082}

spring.cloud.compatibility-verifier.enabled=false