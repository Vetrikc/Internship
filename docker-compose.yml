services:
  app:
    build: .
    container_name: my-spring-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_MAIN_URL: ${SPRING_DATASOURCE_MAIN_URL}
      SPRING_DATASOURCE_MAIN_USERNAME: ${SPRING_DATASOURCE_MAIN_USERNAME}
      SPRING_DATASOURCE_MAIN_PASSWORD: ${SPRING_DATASOURCE_MAIN_PASSWORD}

      # Подключение к БД авторизации
      SPRING_DATASOURCE_AUTH_URL: ${SPRING_DATASOURCE_AUTH_URL}
      SPRING_DATASOURCE_AUTH_USERNAME: ${SPRING_DATASOURCE_AUTH_USERNAME}
      SPRING_DATASOURCE_AUTH_PASSWORD: ${SPRING_DATASOURCE_AUTH_PASSWORD}

      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
    depends_on:
      - db
      - redis
      - auth_db

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB}
      POSTGRES_USER: ${POSTGRES_MAIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - internship:/var/lib/postgresql/data

  auth_db:
    image: postgres:15
    container_name: postgres_auth_db
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - internship_auth:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis_data:
  internship_auth:
  internship:
