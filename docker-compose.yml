services:
  api-gateway:
    build:
      context: .
      dockerfile: api-geteway/Dockerfile
    container_name: api-geteway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service

    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_USER_URL=jdbc:postgresql://db:5432/${POSTGRES_USER_DB}
      - SPRING_DATASOURCE_USER_USERNAME=${POSTGRES_USER_USER}
      - SPRING_DATASOURCE_USER_PASSWORD=${POSTGRES_USER_PASSWORD}
      - SPRING_REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_AUTH_URL=jdbc:postgresql://auth_db:5432/${POSTGRES_AUTH_DB}
      - SPRING_DATASOURCE_AUTH_USERNAME=${POSTGRES_AUTH_USER}
      - SPRING_DATASOURCE_AUTH_PASSWORD=${POSTGRES_AUTH_PASSWORD}
      - SPRING_REDIS_HOST=redis
    depends_on:
      auth_db:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_ORDER_URL=jdbc:postgresql://order_db:5432/${POSTGRES_ORDER_DB}
      - SPRING_DATASOURCE_ORDER_USERNAME=${POSTGRES_ORDER_USER}
      - SPRING_DATASOURCE_ORDER_PASSWORD=${POSTGRES_ORDER_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      order_db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_PAYMENT_URL=jdbc:postgresql://payment_db:5432/${POSTGRES_PAYMENT_DB}
      - SPRING_DATASOURCE_PAYMENT_USERNAME=${POSTGRES_PAYMENT_USER}
      - SPRING_DATASOURCE_PAYMENT_PASSWORD=${POSTGRES_PAYMENT_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      payment_db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  payment_db:
    image: postgres:15
    container_name: postgres_payment_db
    environment:
      POSTGRES_DB: ${POSTGRES_PAYMENT_DB}
      POSTGRES_USER: ${POSTGRES_PAYMENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - internship_payment:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_PAYMENT_USER} -d ${POSTGRES_PAYMENT_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_USER_DB}
      POSTGRES_USER: ${POSTGRES_USER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - internship_user:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth_db:
    image: postgres:15
    container_name: postgres_auth_db
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - internship_auth:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order_db:
    image: postgres:15
    container_name: postgres_order_db
    environment:
      POSTGRES_DB: ${POSTGRES_ORDER_DB}
      POSTGRES_USER: ${POSTGRES_ORDER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ORDER_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - internship_order:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_ORDER_USER} -d ${POSTGRES_ORDER_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "echo", "ruok", "|", "nc", "-w", "1", "localhost", "2181", "|", "grep", "imok" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1



volumes:
  internship_user:
  internship_auth:
  internship_order:
  redis_data:
  internship_payment:

