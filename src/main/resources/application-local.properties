spring.datasource.main.jdbc-url = ${DB_URL}
spring.datasource.main.username = ${DB_USER}
spring.datasource.main.password = ${DB_PASS}
spring.datasource.main.hikari.maximum-pool-size=20
spring.datasource.main.hikari.connection-timeout=30000
spring.datasource.main.hikari.jdbcUrl = ${DB_URL}

spring.datasource.auth.jdbc-url = ${SPRING_DATASOURCE_AUTH_URL}
spring.datasource.auth.username = ${SPRING_DATASOURCE_AUTH_USERNAME}
spring.datasource.auth.password = ${SPRING_DATASOURCE_AUTH_PASSWORD}
spring.datasource.auth.hikari.maximum-pool-size=10
spring.datasource.auth.hikari.connection-timeout=30000
spring.datasource.auth.hikari.jdbcUrl = ${SPRING_DATASOURCE_AUTH_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.data.redis.timeout=60000
spring.cache.redis.time-to-live=600000

jwt.secret=5466478365873465897368456739865367567834567
jwt.access-expiration=900000
jwt.refresh-expiration=604800000


springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
