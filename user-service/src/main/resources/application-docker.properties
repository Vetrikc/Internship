spring.datasource.main.jdbc-url = ${SPRING_DATASOURCE_USER_URL}
spring.datasource.main.username = ${SPRING_DATASOURCE_USER_USERNAME}
spring.datasource.main.password = ${SPRING_DATASOURCE_USER_PASSWORD}
spring.datasource.main.hikari.maximum-pool-size=20
spring.datasource.main.hikari.connection-timeout=30000
spring.datasource.main.hikari.jdbcUrl = ${SPRING_DATASOURCE_MAIN_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

spring.cache.type=redis
spring.data.redis.timeout=60000
spring.cache.redis.time-to-live=600000

jwt.secret=5466478365873465897368456739865367567834567
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

server.port=8082

spring.cloud.compatibility-verifier.enabled=false

logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG

management.endpoints.web.exposure.include=health,info

management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
