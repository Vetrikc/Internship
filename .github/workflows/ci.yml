name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - order-service
          - payment-service
          - api-gateway
      fail-fast: false

    steps:
      # 1. Checkout кода
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Установка JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Docker
        run: |
          docker version
          docker info
          ls -l /var/run/docker.sock

      # Кэши
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # 3. Сборка + тесты
      - name: Build & Test
        run: ./gradlew :${{ matrix.service }}:clean :${{ matrix.service }}:build

      # 4. Анализ кода SonarQube
      - name: SonarQube Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew :${{ matrix.service }}:sonar \
            -Dsonar.projectKey=myproject_${{ matrix.service }} \
            -Dsonar.projectName="${{ matrix.service }} service"

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -f ${{ matrix.service }}/Dockerfile \
            -t vetrikc/${{ matrix.service }}:${{ github.sha }} \
            -t vetrikc/${{ matrix.service }}:latest \
            .

      # 6. Push в Docker Hub
      - name: Push Docker image
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push vetrikc/${{ matrix.service }}:${{ github.sha }}
          docker push vetrikc/${{ matrix.service }}:latest