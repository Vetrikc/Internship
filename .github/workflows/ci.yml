name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - order-service

      fail-fast: false
      max-parallel: 10

    # Пропускаем сборку сервиса, если в этом коммите/ПР он не менялся
    if: |
      github.ref == 'refs/heads/main' || 
      contains(needs.detect-changes.outputs.changed-files, matrix.service)

    needs: detect-changes
    steps:
      # 1. Checkout кода
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Установка JDK (если нужны тесты)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle

      - name: Cache Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # 3. Сборка и тесты (Gradle)
      - name: Build ${{ matrix.service }}
        run: ./gradlew :${{ matrix.service }}:clean :${{ matrix.service }}:build -x test

      # 4. Анализ кода SonarQube
      - name: SonarQube Scan ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew :${{ matrix.service }}:sonar \ 
            -Dsonar.projectKey=myproject_${{ matrix.service }} \
            -Dsonar.projectName="${{ matrix.service }}"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image ${{ matrix.service }}
        run: |
          IMAGE=vetrikc/${{ matrix.service }}
          cd ${{ matrix.service }}   # если Dockerfile лежит в папке сервиса
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changes.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files=$(git diff --name-only origin/${{ github.base_ref }} ${{ github.sha }} | grep -v "^$" | paste -sd "," -)
          else
            files=$(git diff --name-only HEAD^ HEAD | grep -v "^$" | paste -sd "," -)
          fi
          echo "files=$files" >> $GITHUB_OUTPUT
          echo "Изменённые пути: $files"