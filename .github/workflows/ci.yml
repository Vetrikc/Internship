name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    #services:
     # postgres:
     #   image: postgres:15
      #  env:
      #    POSTGRES_USER: myuser
     #     POSTGRES_PASSWORD: mypassword
      #    POSTGRES_DB: mydb
     #   ports:
      #    - 5432:5432
     #  options: >-
       #   --health-cmd="pg_isready -U myuser"
       #   --health-interval=10s
      #    --health-timeout=5s
      #    --health-retries=20

     # redis:
      #  image: redis:7
      #  ports:
      #    - 6379:6379
      #  options: >-
        #  --health-cmd="redis-cli ping"
        #  --health-interval=10s
        #  --health-timeout=5s
         # --health-retries=5

    steps:
      # 1. Checkout кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка JDK (если нужны тесты)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 3. Сборка и тесты (Gradle)
      - name: Build & Test
        #env:
          #SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydb
          #SPRING_DATASOURCE_USERNAME: myuser
          #SPRING_DATASOURCE_PASSWORD: mypassword
          #SPRING_REDIS_HOST: redis
          #SPRING_REDIS_PORT: 6379
        run: ./gradlew clean build test

      # 4. Анализ кода SonarQube
      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=my_project_key
            -Dsonar.organization=my_org
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=0038266fc9fe52d924a8ca2dc0e231bf0b76e4f1

      # 5. Использование готового Docker-образа
      - name: Load existing Docker image
        run: docker load < my-spring-app.tar

      # 6. Тег и push в DockerHub (или другой registry)
      - name: Push Docker image
        run: |
          echo "290307Vs!" | docker login -u "vetrikc" --password-stdin
          docker tag my-spring-app:latest myrepo/my-spring-app:${{ github.sha }}
          docker push myrepo/my-spring-app:${{ github.sha }}
