spring.datasource.order.jdbc-url = ${SPRING_DATASOURCE_PAYMENT_URL}
spring.datasource.order.username = ${SPRING_DATASOURCE_PAYMENT_USERNAME}
spring.datasource.order.password = ${SPRING_DATASOURCE_PAYMENT_PASSWORD}
spring.datasource.order.hikari.maximum-pool-size=10
spring.datasource.order.hikari.connection-timeout=30000
