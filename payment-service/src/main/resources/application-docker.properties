spring.datasource.payment.jdbc-url = ${SPRING_DATASOURCE_PAYMENT_URL}
spring.datasource.payment.username = ${SPRING_DATASOURCE_PAYMENT_USERNAME}
spring.datasource.payment.password = ${SPRING_DATASOURCE_PAYMENT_PASSWORD}
spring.datasource.payment.hikari.maximum-pool-size=10
spring.datasource.payment.hikari.connection-timeout=30000
spring.datasource.payment.hikari.jdbcUrl = ${SPRING_DATASOURCE_PAYMENT_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

jwt.secret=5466478365873465897368456739865367567834567
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

server.port=8084

spring.kafka.bootstrap-servers= kafka:9092
spring.kafka.producer.key-serializer= org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer= org.springframework.kafka.support.serializer.JsonSerializer

management.endpoints.web.exposure.include=health,info

management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true


