spring.datasource.order.jdbc-url = ${SPRING_DATASOURCE_ORDER_URL}
spring.datasource.order.username = ${SPRING_DATASOURCE_ORDER_USERNAME}
spring.datasource.order.password = ${SPRING_DATASOURCE_ORDER_PASSWORD}
spring.datasource.order.hikari.maximum-pool-size=10
spring.datasource.order.hikari.connection-timeout=30000
spring.datasource.order.hikari.jdbcUrl = ${SPRING_DATASOURCE_ORDER_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

jwt.secret=5466478365873465897368456739865367567834567
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

server.port=8083

spring.cloud.compatibility-verifier.enabled=false

user.service.url = http://user-service:8082

spring.kafka.bootstrap-servers= kafka:9092
spring.kafka.producer.key-serializer= org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer= org.springframework.kafka.support.serializer.JsonSerializer

# --- Kafka base ---
kafka.bootstrap-servers=kafka:9092

# --- Consumer ---
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.innowise.orderservice.event.PaymentEvent


# --- Producer ---
logging.level.org.springframework.kafka=DEBUG