plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.0.1.6134"
}

group = 'com.innowise'
version = '0.0.1-SNAPSHOT'
description = 'internship'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.sonarqube'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'



        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-security'

        implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
        implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        implementation 'org.mapstruct:mapstruct:1.6.3'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

        // OpenAPI / Swagger
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

        //tests
        runtimeOnly 'org.postgresql:postgresql'
        testImplementation "org.testcontainers:testcontainers:1.20.3"
        testImplementation "org.testcontainers:junit-jupiter:1.20.3"
        testImplementation "org.testcontainers:postgresql:1.20.3"
        testImplementation 'com.redis.testcontainers:testcontainers-redis:1.6.4'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.security:spring-security-test'

        implementation "org.springframework.cloud:spring-cloud-starter-openfeign"


        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // Source: https://mvnrepository.com/artifact/io.micrometer/micrometer-registry-prometheus
        implementation 'io.micrometer:micrometer-registry-prometheus:1.16.2'
        // Source: https://mvnrepository.com/artifact/io.micrometer/micrometer-tracing-bridge-otel
        implementation 'io.micrometer:micrometer-tracing-bridge-otel:1.6.1'
        // Source: https://mvnrepository.com/artifact/io.opentelemetry/opentelemetry-exporter-otlp
        implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.55.0'
        // Source: https://mvnrepository.com/artifact/com.github.loki4j/loki-logback-appender
        implementation 'com.github.loki4j:loki-logback-appender:2.0.0'
    }

    test {
        useJUnitPlatform()
    }
    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
        }
    }
}

project(':auth-service') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'

        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    }
}
project(':user-service') {
    dependencies {
        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        implementation 'org.springframework.boot:spring-boot-starter-web'

        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    }
}
project(':order-service') {
    dependencies {
        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        implementation 'org.springframework.boot:spring-boot-starter-web'

        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'

        //kafka
        implementation "org.springframework.kafka:spring-kafka"

        testImplementation 'org.testcontainers:kafka:1.21.4'
        testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
        testImplementation 'org.testcontainers:testcontainers:1.21.4'
    }
}

project(':api-gateway') {
    dependencies {

        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
        implementation 'org.springframework.boot:spring-boot-starter-security'

    }
}

project(':payment-service') {
    dependencies {
        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        implementation 'org.springframework.boot:spring-boot-starter-web'

        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'

        //kafka
        implementation "org.springframework.kafka:spring-kafka"

        testImplementation 'org.wiremock:wiremock-jetty12:3.13.2'
        testImplementation 'org.testcontainers:postgresql:1.21.4'
        testImplementation 'org.testcontainers:kafka:1.21.4'
        testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
        testImplementation 'org.testcontainers:testcontainers:1.21.4'
    }
}

// SonarQube конфигурация в корне
sonar {
    properties {
        property "sonar.projectKey", "0987123_internship"
        property "sonar.organization", "0987123"
    }
}